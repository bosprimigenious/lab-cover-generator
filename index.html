<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Report Cover Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Times New Roman"', 'SimSun', '"Songti SC"', '"Noto Serif SC"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            screens: {
              print: { raw: 'print' },
            },
          },
        },
      }
    </script>
    <!-- Google Fonts: Noto Serif SC as a fallback for SimSun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Force light mode to prevent dark mode overrides causing white text on white background */
      :root {
        color-scheme: light;
      }
      
      /* Custom print styles to ensure background graphics and exact layout */
      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body {
          -webkit-print-color-adjust: exact;
        }
      }
      /* Utility for text-align-last */
      .text-justify-last {
        text-align-last: justify;
        text-align: justify;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "pdf-lib": "https://aistudiocdn.com/pdf-lib@^1.17.1",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
